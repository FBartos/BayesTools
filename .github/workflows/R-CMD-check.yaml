name: R-CMD-check

on:
  push:
    branches: [main, master, pre-release]
  pull_request:
    branches: [main, master, pre-release]

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: '4.6'}
          - {os: ubuntu-latest, r: '4.6'}
          - {os: macos-15-intel, r: '4.6'}
    steps:
      - uses: actions/checkout@v6

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Cache R packages
      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      # Cache system dependencies
      - name: Cache system dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/R-CMD-check.yaml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # Cache JAGS installation (Windows)
      - name: Cache JAGS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: C:\Program Files\JAGS
          key: ${{ runner.os }}-jags-4.3.1
          restore-keys: |
            ${{ runner.os }}-jags-

      # Cache the JAGS 4.3.2 installer (macOS). BayesTools requires JAGS 4.x;
      # Homebrew's jags formula installs JAGS 5, so the official universal
      # package is used instead.
      - name: Cache JAGS installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/jags-installer
          key: ${{ runner.os }}-jags-pkg-4.3.2

      # Install JAGS and system dependencies on Linux
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libuv1-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            jags

      # Install JAGS on Windows
      - name: Install JAGS (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\JAGS\JAGS-4.3.1\bin\jags-terminal.exe" (
            echo "JAGS not found in cache, downloading and installing..."
            curl -o jags-installer.exe -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe/download
            jags-installer.exe /S
            del jags-installer.exe
          ) else (
            echo "JAGS found in cache, skipping installation"
          )

      # Set JAGS environment variables on Windows
      - name: Set JAGS environment variables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo JAGS_ROOT=C:\Program Files\JAGS\JAGS-4.3.1>> %GITHUB_ENV%
          echo JAGS_MAJOR_VERSION=4>> %GITHUB_ENV%
          echo PATH=C:\Program Files\JAGS\JAGS-4.3.1\bin;%PATH%>> %GITHUB_ENV%

      # Install JAGS 4.3.2 on macOS from the official universal package, which
      # installs into /usr/local (library, JAGS headers, jags.pc, jags binary)
      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/jags-installer
          if [ ! -f ~/jags-installer/JAGS-4.3.2.pkg ]; then
            echo "JAGS installer not found in cache, downloading..."
            curl --retry 3 --fail -L -o ~/jags-installer/JAGS-4.3.2.pkg \
              https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.pkg/download
          fi
          sudo installer -pkg ~/jags-installer/JAGS-4.3.2.pkg -target /
          if brew list --formula jags > /dev/null 2>&1; then
            brew uninstall --ignore-dependencies jags
          fi

      # Point pkg-config at the JAGS 4.3.2 installation; configure rejects any
      # JAGS major version other than 4 with a clear message
      - name: Set Environment Variables (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          if command -v pkg-config > /dev/null 2>&1; then
            echo "pkg-config reports JAGS $(PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion jags)"
          fi

      # Install the package
      - name: Install the required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          # Check if packages are already installed before installing
          required_packages <- c('devtools', 'rcmdcheck', 'BayesFactor', 'RoBMA', 'runjags', 'rjags', 'rstan', 'rstanarm', 'scales', 'vdiffr', 'testthat', 'covr', 'knitr', 'rmarkdown', 'lme4')
          missing_packages <- required_packages[!sapply(required_packages, requireNamespace, quietly = TRUE)]

          if (length(missing_packages) > 0) {
            cat("Installing missing packages:", paste(missing_packages, collapse = ", "), "\n")
            install.packages(missing_packages)
          } else {
            cat("All required packages are already installed\n")
          }

          devtools::install()
        shell: Rscript {0}

      - name: Render package vignettes
        run: |
          vignette_files <- sort(list.files(
            "vignettes",
            pattern = "\\.Rmd$",
            full.names = TRUE
          ))
          for (vignette_file in vignette_files) {
            message("Rendering ", basename(vignette_file))
            rmarkdown::render(
              vignette_file,
              output_dir = tempdir(),
              envir = new.env(parent = globalenv()),
              quiet = TRUE
            )
          }
        shell: Rscript {0}

      - name: Check
        if: runner.os != 'Windows'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          BAYESTOOLS_TEST_PROFILE: all
          AGENT: 1
          NOT_CRAN: true
          VDIFFR_RUN_TESTS: true
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Check
        if: runner.os == 'Windows'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          BAYESTOOLS_TEST_PROFILE: all
          AGENT: 1
          NOT_CRAN: true
          VDIFFR_RUN_TESTS: true
          JAGS_ROOT: "/c/progra~1/JAGS/JAGS-4.3.1"
          JAGS_MAJOR_VERSION: 4
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
