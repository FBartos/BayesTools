name: R-CMD-check

# Pushes and pull requests check the CI platforms; weekly.yaml and
# release-check.yaml call this workflow for further R versions and platforms.
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of runner configurations, each {"os", "r"}.
        type: string
        required: true
      ref:
        description: Git ref to check; empty checks the triggering ref.
        type: string
        default: ""

# Called workflows share the caller's github.workflow, hence the literal prefix.
concurrency:
  group: R-CMD-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    env:
      BAYESTOOLS_VIGNETTE_REFIT: "false"
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix || '[{"os":"windows-latest","r":"4.6"},{"os":"ubuntu-latest","r":"4.6"},{"os":"macos-latest","r":"4.6"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      # Cache R packages; the macOS runners differ in architecture only
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      - name: Cache system dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/R-CMD-check.yaml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libssl-dev \
            libuv1-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev

      - name: Install the required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          # Check installation without loading namespaces: loading RoBMA would
          # load a cached BayesTools DLL that the installation step cannot
          # replace on Windows while this process holds it.
          required_packages <- c('devtools', 'rcmdcheck', 'BayesFactor', 'RoBMA', 'runjags', 'rjags', 'rstan', 'rstanarm', 'brms', 'scales', 'vdiffr', 'testthat', 'covr', 'knitr', 'rmarkdown', 'lme4')
          is_installed <- nzchar(vapply(required_packages, function(package) system.file(package = package), character(1)))
          missing_packages <- required_packages[!is_installed]

          if (length(missing_packages) > 0) {
            cat("Installing missing packages:", paste(missing_packages, collapse = ", "), "\n")
            install.packages(missing_packages)
          } else {
            cat("All required packages are already installed\n")
          }
        shell: Rscript {0}

      # Install BayesTools in a fresh process that has not loaded any package
      - name: Install BayesTools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          devtools::install()
        shell: Rscript {0}

      - name: Render package vignettes
        run: |
          vignette_files <- sort(list.files(
            "vignettes",
            pattern = "\\.Rmd$",
            full.names = TRUE
          ))
          for (vignette_file in vignette_files) {
            message("Rendering ", basename(vignette_file))
            rmarkdown::render(
              vignette_file,
              output_dir = tempdir(),
              envir = new.env(parent = globalenv()),
              quiet = TRUE
            )
          }
        shell: Rscript {0}

      # The built package ships only CRAN's smoke test; R-tests runs the profiles.
      - name: Check
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          AGENT: 1
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      # A binary the maintainer can install to try a pull request.
      - name: Build Windows binary
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        run: |
          dir.create("binary")
          pkgbuild::build(binary = TRUE, dest_path = "binary")
        shell: Rscript {0}

      - name: Upload Windows binary
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: BayesTools-windows-binary
          path: binary/*.zip
          retention-days: 14

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-r${{ matrix.config.r }}-results
          path: check
