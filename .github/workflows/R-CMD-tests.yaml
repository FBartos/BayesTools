name: R-unit-tests

# Runs the full developer profile (`all`). post-merge.yaml calls this workflow
# for the macOS runners.
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of runner configurations, each {"os", "r"}.
        type: string
        required: true

# A called workflow sees the caller's github.workflow: the literal prefix keeps
# two workflows called by one caller apart, github.workflow keeps the callers
# (and a direct run) apart.
concurrency:
  group: R-unit-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix || '[{"os":"windows-latest","r":"4.6"},{"os":"ubuntu-latest","r":"4.6"}]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      # Cache R packages; the macOS runners differ in architecture only
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      - name: Cache system dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/R-CMD-tests.yaml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libssl-dev \
            libuv1-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev

      - name: Select Test Profile
        shell: pwsh
        run: |
          $profile = "all"

          "BAYESTOOLS_CI_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BAYESTOOLS_TEST_FILES_DIR=$(Join-Path $env:RUNNER_TEMP 'BayesTools_test_files')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Selected BayesTools test profile: $profile"

      - name: Install the required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          # Check installation without loading namespaces: loading RoBMA would
          # load a cached BayesTools DLL that the installation step cannot
          # replace on Windows while this process holds it.
          required_packages <- c('devtools', 'testthat', 'vdiffr', 'lme4', 'BayesFactor', 'RoBMA', 'runjags', 'rjags', 'rstan')
          is_installed <- nzchar(vapply(required_packages, function(package) system.file(package = package), character(1)))
          missing_packages <- required_packages[!is_installed]

          if (length(missing_packages) > 0) {
            cat("Installing missing packages:", paste(missing_packages, collapse = ", "), "\n")
            install.packages(missing_packages)
          } else {
            cat("All required packages are already installed\n")
          }
        shell: Rscript {0}

      # Install BayesTools in a fresh process that has not loaded any package
      - name: Install BayesTools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          devtools::install()
        shell: Rscript {0}

      # Report every failure instead of stopping at testthat's default of ten.
      - name: Run Test Profile
        shell: pwsh
        env:
          TESTTHAT_MAX_FAILS: Inf
        run: |
          Rscript tools/test-profile.R "$env:BAYESTOOLS_CI_PROFILE"

      # The fits and the snapshot candidates of failed snapshot tests.
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bayestools-test-artifacts-${{ runner.os }}-${{ runner.arch }}-r${{ matrix.config.r }}-${{ github.event_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/BayesTools_test_files
            tests/testthat/_snaps/**/*.new.*
          if-no-files-found: ignore
          retention-days: 14
