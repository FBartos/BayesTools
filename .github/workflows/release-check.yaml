name: release-check

# Runs on the release pull request (development into master) and on hotfix pull
# requests: R CMD check --as-cran on the further CRAN platforms and R versions,
# the CRAN reverse dependencies, URLs, and the pkgdown reference index. The
# pull request's R-CMD-check run covers the usual platforms.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      matrix: >-
        [{"os": "windows-latest", "r": "devel"},
         {"os": "windows-latest", "r": "oldrel-1"},
         {"os": "ubuntu-latest", "r": "devel"},
         {"os": "macos-latest", "r": "oldrel-1"},
         {"os": "macos-15-intel", "r": "4.6"}]

  revdeps:
    uses: ./.github/workflows/downstream.yaml
    with:
      source: cran

  urls-and-site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::urlchecker
            any::pkgdown
            local::.

      # CRAN's site can take longer to connect than the checker's 5 second limit.
      - name: Check URLs
        run: |
          for (attempt in 1:3) {
            problems <- urlchecker::url_check()
            if (nrow(problems) == 0L) break
            print(problems)
            Sys.sleep(60)
          }
          if (nrow(problems) > 0L) {
            stop("URL check found ", nrow(problems), " problem(s).", call. = FALSE)
          }
        shell: Rscript {0}

      - name: Check the pkgdown reference index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
