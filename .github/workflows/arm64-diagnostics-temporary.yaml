name: arm64-diagnostics-temporary

# Temporary: prints Apple silicon floating-point facts for the pull request.
# Removed before the pull request is ready for review.
on:
  pull_request:
    branches: [development]

jobs:
  diagnostics:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      - name: Cache R packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      - name: Install the required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          required <- c("devtools", "withr", "ggplot2", "runjags", "rjags")
          missing <- required[!nzchar(vapply(required, function(p) system.file(package = p), character(1)))]
          if (length(missing)) install.packages(missing)
        shell: Rscript {0}

      - name: Install BayesTools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          devtools::install()
        shell: Rscript {0}

      - name: Diagnostics
        run: Rscript .github/arm64-diagnostics.R
