name: test-coverage

# Coverage reruns the full developer profile under instrumentation; it reports
# development's coverage after each merge and does not gate pull requests.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      - name: Install the required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          # Check installation without loading namespaces: loading RoBMA would
          # load a cached BayesTools DLL that the installation step cannot
          # replace on Windows while this process holds it.
          required_packages <- c('devtools', 'rcmdcheck', 'BayesFactor', 'RoBMA', 'runjags', 'rjags', 'rstan', 'scales', 'vdiffr', 'testthat', 'covr', 'knitr', 'rmarkdown', 'lme4')
          is_installed <- nzchar(vapply(required_packages, function(package) system.file(package = package), character(1)))
          missing_packages <- required_packages[!is_installed]

          if (length(missing_packages) > 0) {
            cat("Installing missing packages:", paste(missing_packages, collapse = ", "), "\n")
            install.packages(missing_packages)
          } else {
            cat("All required packages are already installed\n")
          }
        shell: Rscript {0}

      # Install BayesTools in a fresh process that has not loaded any package
      - name: Install BayesTools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          devtools::install()
        shell: Rscript {0}

      # Run the coverage check
      - name: Test coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          # This workflow is coverage-only and runs the full developer profile.
          BAYESTOOLS_TEST_PROFILE: "all"
          BAYESTOOLS_TEST_FILES_DIR: ${{ runner.temp }}/BayesTools_test_files
          BAYESTOOLS_TEST_SKIP_REFIT: "false"
          NOT_CRAN: "true"
          VDIFFR_RUN_TESTS: "true"
          AGENT: "1"
        run: |
          # Run source-tree tests against covr's already-loaded instrumented
          # package. Using devtools::test() here reloads the source tree through
          # pkgload and can produce an empty trace, while type = "tests" runs
          # copied installed tests without the original R/*.R files that the
          # fixture-cache metadata hashes intentionally inspect.
          # Use forward-slash paths on Windows; covr injects these paths into
          # instrumented R code, where backslashes can become invalid escapes.
          repo_path <- normalizePath(".", winslash = "/", mustWork = TRUE)
          install_path <- normalizePath(file.path(Sys.getenv("RUNNER_TEMP"), "R_LIBS"), winslash = "/", mustWork = FALSE)
          unlink(install_path, recursive = TRUE, force = TRUE)

          # Rscript runs this block at top level, where on.exit() never fires;
          # the snapshot cleanup runs in `finally` whether coverage succeeds or not.
          coverage <- tryCatch(
            covr::package_coverage(
              path = repo_path,
              type = "none",
              quiet = FALSE,
              clean = FALSE,
              install_path = install_path,
              code = c(
                "repo_path <- normalizePath('.', winslash = '/', mustWork = TRUE)",
                "setwd(repo_path)",
                "test_files_dir <- Sys.getenv('BAYESTOOLS_TEST_FILES_DIR')",
                "if (test_files_dir == '') test_files_dir <- file.path(tempdir(), 'BayesTools_test_files')",
                "dir.create(test_files_dir, showWarnings = FALSE, recursive = TRUE)",
                "Sys.setenv(BAYESTOOLS_TEST_FILES_DIR = normalizePath(test_files_dir, winslash = '/', mustWork = TRUE))",
                "reporter <- if (identical(Sys.getenv('AGENT'), '1') && exists('LlmReporter', envir = asNamespace('testthat'), inherits = FALSE)) testthat::LlmReporter$new() else NULL",
                "testthat::test_dir(file.path(repo_path, 'tests', 'testthat'), reporter = reporter, package = 'BayesTools', load_package = 'installed', stop_on_failure = TRUE)"
              )
            ),
            finally = unlink(file.path(repo_path, "tests/testthat/_snaps"), recursive = TRUE, force = TRUE)
          )
          if (covr::percent_coverage(coverage) == 0) {
            stop("Coverage trace is empty; refusing to upload 0% coverage.", call. = FALSE)
          }
          covr::codecov(coverage = coverage)
        shell: Rscript {0}
      
      # Print test failure details if coverage fails
      - name: Show testthat output
        if: failure()
        shell: pwsh
        run: |
          $failFiles = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter "*.Rout.fail" -ErrorAction SilentlyContinue
          if ($failFiles) {
            foreach ($file in $failFiles) {
              Write-Host "`n=== Contents of $($file.FullName) ===`n"
              Get-Content $file.FullName
            }
          } else {
            Write-Host "No *.Rout.fail files found in $env:RUNNER_TEMP"
          }
