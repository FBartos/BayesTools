name: post-merge

# After each merge into development: platforms and R versions outside the
# pull request checks, and the dependent packages' development branches against
# BayesTools development.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      matrix: >-
        [{"os": "windows-latest", "r": "devel"},
         {"os": "windows-latest", "r": "oldrel-1"},
         {"os": "macos-15-intel", "r": "4.6"}]

  tests:
    uses: ./.github/workflows/R-test.yaml
    with:
      matrix: >-
        [{"os": "macos-latest", "r": "4.6"},
         {"os": "macos-15-intel", "r": "4.6"}]

  # RoBSA joins once its development branch supports BayesTools 0.4.
  downstream:
    uses: ./.github/workflows/downstream.yaml
    with:
      source: development
      dependents: '["RoBMA", "RoBTT"]'
