name: pkgdown

# master and release tags publish the release site; development publishes the
# development site under /dev/.
on:
  push:
    branches: [master, development]
    tags: ['*']
  workflow_dispatch:

# Deployments run one at a time: each force-pushes gh-pages, so two at once
# would drop the earlier one's pages. A newer push replaces a pending
# deployment; re-run a release deployment that was cancelled that way.
concurrency:
  group: pkgdown-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BAYESTOOLS_VIGNETTE_REFIT: "false"
      PKGDOWN_DEV_MODE: ${{ github.ref == 'refs/heads/development' && 'devel' || 'release' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: ./.github/actions/setup-jags

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-cache-v2-

      - name: Install required packages
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          # Check installation without loading namespaces: loading RoBMA would
          # load a cached BayesTools DLL that the installation step cannot
          # replace on Windows while this process holds it.
          required_packages <- c('devtools', 'pkgdown', 'BayesFactor', 'RoBMA', 'runjags', 'rjags', 'rstan', 'rstanarm', 'brms', 'scales', 'vdiffr', 'testthat', 'covr', 'knitr', 'rmarkdown', 'pandoc', 'lme4')
          is_installed <- nzchar(vapply(required_packages, function(package) system.file(package = package), character(1)))
          missing_packages <- required_packages[!is_installed]

          if (length(missing_packages) > 0) {
            cat("Installing missing packages:", paste(missing_packages, collapse = ", "), "\n")
            install.packages(missing_packages)
          } else {
            cat("All required packages are already installed\n")
          }
        shell: Rscript {0}

      # Install BayesTools in a fresh process that has not loaded any package
      - name: Install BayesTools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          devtools::install()
        shell: Rscript {0}

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
